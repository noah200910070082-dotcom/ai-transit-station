name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Design check
        run: npm run design:check

      - name: Dependency audit
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm audit service unavailable; retrying in $((attempt * 15)) seconds..."
            sleep $((attempt * 15))
          done
